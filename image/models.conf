# Models baked into C.O.R.E. OS images.
#
# Columns: role  file  sha256  url
#   role    llm (served by llama.cpp, linked as core.gguf)
#           whisper (speech recognition, linked as whisper.bin)
#   sha256  expected checksum, or "-" if not pinned yet. Unpinned downloads are
#           refused unless --allow-unpinned is given; the script then prints the hash
#           so it can be pinned here. Pin before shipping an image.
#
# The default language model is a ~2.5 GB 4-bit quantisation of a 4B-parameter
# instruction model with strong tool-calling for its size; it runs in about 4 GB of
# RAM with an 8K context. See docs/MODELS.md for alternatives and sizing.

llm      Qwen3-4B-Instruct-2507-Q4_K_M.gguf   -   https://huggingface.co/unsloth/Qwen3-4B-Instruct-2507-GGUF/resolve/main/Qwen3-4B-Instruct-2507-Q4_K_M.gguf
whisper  ggml-base.bin                        -   https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin
