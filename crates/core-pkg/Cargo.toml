[package]
name = "core-pkg"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
core-protocol = { version = "0.1.0", path = "../core-protocol" }
ed25519-dalek = "3.0.0"
hex = "0.4.3"
libc = "0.2.189"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.46"
toml = "1.1.6"
ureq = "3.4.2"
zstd = { version = "0.14.0", features = ["zstdmt"] }

[[bin]]
name = "cpkg"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.27.0"
