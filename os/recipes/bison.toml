[package]
name = "bison"
version = "3.8.2"
summary = "Parser generator"
license = "GPL-3.0-or-later"
homepage = "https://www.gnu.org/software/bison/"

[[source]]
sha256 = "dff8a3c96dd34121828f62a7fa49e1f7765815b89e59f564e8d2a9e71c177be5"
urls = ["https://archive.ubuntu.com/ubuntu/pool/main/b/bison/bison_3.8.2+dfsg.orig.tar.xz"]

[build]
script = '''
# Ubuntu's +dfsg tarball omits the GFDL manual (doc/bison.texi). The examples
# ship already extracted from it, so cut the dependencies on the manual and
# build no info pages.
sed -i -e 's|^INFO_DEPS = .*|INFO_DEPS =|' \
       -e 's|^examples/extracted.stamp: $(doc) |examples/extracted.stamp: |' \
       -e 's|^$(srcdir)/doc/stamp-vti: doc/bison.texi .*|$(srcdir)/doc/stamp-vti:|' \
       -e 's|^all-local: $(srcdir)/$(doc_bison).info.bak$|all-local:|' Makefile.in
./configure --prefix=/usr --docdir=/usr/share/doc/bison-3.8.2
make
make DESTDIR="$DESTDIR" install
'''
