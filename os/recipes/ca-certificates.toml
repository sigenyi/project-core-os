[package]
name = "ca-certificates"
version = "20260223"
summary = "Certificate authorities trusted for TLS (Mozilla list)"
license = "MPL-2.0"
homepage = "https://wiki.mozilla.org/CA"

[[source]]
sha256 = "2fa2b00d4360f0d14ec51640ae8aea9e563956b95ea786e3c3c01c4eead42b56"
urls = ["https://archive.ubuntu.com/ubuntu/pool/main/c/ca-certificates/ca-certificates_20260223.tar.xz"]

[build]
files = ["ca-certificates/make-bundle.py"]
script = '''
python3 make-bundle.py mozilla/certdata.txt > ca-certificates.crt
install -Dm644 ca-certificates.crt "$DESTDIR/etc/ssl/certs/ca-certificates.crt"
ln -sf certs/ca-certificates.crt "$DESTDIR/etc/ssl/cert.pem"
'''
