[package]
name = "python-wheel"
version = "0.46.3"
summary = "Python wheel tool"
license = "MIT"
homepage = "https://github.com/pypa/wheel"

[[source]]
sha256 = "e3e79874b07d776c40bd6033f8ddf76a7dad46a7b8aa1b2787a83083519a1803"
urls = ["https://archive.ubuntu.com/ubuntu/pool/universe/w/wheel/wheel_0.46.3.orig.tar.gz"]

[build]
script = '''
cd .
pip3 wheel -w dist --no-cache-dir --no-build-isolation --no-deps "$PWD"
pip3 install --no-index --no-deps --find-links dist --root="$DESTDIR" --no-warn-script-location --no-compile dist/*.whl
'''
