[package]
name = "python-pexpect"
version = "4.9"
summary = "Python module to control interactive programs"
license = "ISC"
homepage = "https://github.com/pexpect/pexpect"

[[source]]
sha256 = "305ab31baae8452dc6406e13c1512095d0df79ff82a9ad7c2638d70d6d836f60"
urls = ["https://archive.ubuntu.com/ubuntu/pool/main/p/pexpect/pexpect_4.9.orig.tar.gz"]

[build]
script = '''
pip3 wheel -w dist --no-cache-dir --no-build-isolation --no-deps "$PWD"
# --ignore-installed: otherwise pip skips a wheel whose version the build machine
# already has, and the package comes out empty.
pip3 install --no-index --no-deps --ignore-installed --find-links dist --root="$DESTDIR" \
  --no-warn-script-location --no-compile dist/*.whl
ls "$DESTDIR"/usr/lib/python3.14/site-packages/*.dist-info/RECORD
'''

[runtime]
depends = ["python-ptyprocess"]
