[package]
name = "diffutils"
version = "3.12"
summary = "File comparison tools"
license = "GPL-3.0-or-later"
homepage = "https://www.gnu.org/software/diffutils/"

[[source]]
sha256 = "7c8b7f9fc8609141fdea9cece85249d308624391ff61dedaf528fcb337727dfd"
urls = ["https://ftp.gnu.org/gnu/diffutils/diffutils-3.12.tar.xz",
        "https://archive.ubuntu.com/ubuntu/pool/main/d/diffutils/diffutils_3.12.orig.tar.xz"]
file = "diffutils_3.12.orig.tar.xz"

[build]
script = '''
./configure --prefix=/usr 
make
make DESTDIR="$DESTDIR" install
'''

[ai]
kind = "cli"
launch = "ls"
keywords = ["list files", "copy", "move", "delete file", "disk usage"]

