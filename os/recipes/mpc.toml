[package]
name = "mpc"
version = "1.3.1"
summary = "Multiple-precision complex arithmetic library"
license = "LGPL-3.0-or-later"
homepage = "https://www.multiprecision.org/mpc/"

[[source]]
sha256 = "ab642492f5cf882b74aa0cb730cd410a81edcdbec895183ce930e706c1c759b8"
urls = ["https://ftp.gnu.org/gnu/mpc/mpc-1.3.1.tar.gz",
        "https://archive.ubuntu.com/ubuntu/pool/main/m/mpclib3/mpclib3_1.3.1.orig.tar.gz"]
file = "mpclib3_1.3.1.orig.tar.gz"

[build]
script = '''
./configure --prefix=/usr --disable-static --docdir=/usr/share/doc/mpc-1.3.1
make
make DESTDIR="$DESTDIR" install
'''
