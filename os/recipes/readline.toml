[package]
name = "readline"
version = "8.3"
summary = "Line editing library"
license = "GPL-3.0-or-later"
homepage = "https://tiswww.case.edu/php/chet/readline/rltop.html"

[[source]]
sha256 = "fe5383204467828cd495ee8d1d3c037a7eba1389c22bc6a041f627976f9061cc"
urls = ["https://ftp.gnu.org/gnu/readline/readline-8.3.tar.gz",
        "https://archive.ubuntu.com/ubuntu/pool/main/r/readline/readline_8.3.orig.tar.gz"]
file = "readline_8.3.orig.tar.gz"

[build]
script = '''
sed -i '/MV.*old/d' Makefile.in
sed -i '/{OLDSUFF}/c:' support/shlib-install
sed -i 's/-Wl,-rpath,[^ ]*//' support/shobj-conf
./configure --prefix=/usr --disable-static --with-curses --docdir=/usr/share/doc/readline-8.3
make SHLIB_LIBS="-lncursesw"
make SHLIB_LIBS="-lncursesw" DESTDIR="$DESTDIR" install
'''

[ai]
kind = "cli"
launch = "file"
keywords = ["file type", "identify file"]

