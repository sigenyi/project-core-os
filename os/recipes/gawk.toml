[package]
name = "gawk"
version = "5.3.2"
summary = "GNU awk"
license = "GPL-3.0-or-later"
homepage = "https://www.gnu.org/software/gawk/"

[[source]]
sha256 = "3b2a95bc6de68e2dc833ce547e366d62001274f8b892c6424f34f70d321cda70"
urls = ["https://ftp.gnu.org/gnu/gawk/gawk-5.3.2.tar.xz",
        "https://archive.ubuntu.com/ubuntu/pool/main/g/gawk/gawk_5.3.2.orig.tar.xz"]
file = "gawk_5.3.2.orig.tar.xz"

[build]
script = '''
sed -i 's/extras//' Makefile.in
./configure --prefix=/usr
make
make DESTDIR="$DESTDIR" LN='ln -f' install
ln -sf gawk.1 "$DESTDIR/usr/share/man/man1/awk.1"
'''

[ai]
kind = "cli"
launch = "diff"
keywords = ["compare files", "difference"]

