[package]
name = "mpfr"
version = "4.2.2"
summary = "Multiple-precision floating-point library"
license = "LGPL-3.0-or-later"
homepage = "https://www.mpfr.org/"

[[source]]
sha256 = "b67ba0383ef7e8a8563734e2e889ef5ec3c3b898a01d00fa0a6869ad81c6ce01"
urls = ["https://ftp.gnu.org/gnu/mpfr/mpfr-4.2.2.tar.xz",
        "https://archive.ubuntu.com/ubuntu/pool/main/m/mpfr4/mpfr4_4.2.2.orig.tar.xz"]
file = "mpfr4_4.2.2.orig.tar.xz"

[build]
script = '''
./configure --prefix=/usr --disable-static --enable-thread-safe --docdir=/usr/share/doc/mpfr-4.2.2
make
make DESTDIR="$DESTDIR" install
'''
