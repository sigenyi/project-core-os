[package]
name = "bc"
version = "1.07.1"
summary = "Arbitrary precision calculator"
license = "GPL-3.0-or-later"
homepage = "https://www.gnu.org/software/bc/"

[[source]]
sha256 = "62adfca89b0a1c0164c2cdca59ca210c1d44c3ffc46daf9931cf4942664cb02a"
urls = ["https://archive.ubuntu.com/ubuntu/pool/main/b/bc/bc_1.07.1.orig.tar.gz"]

[build]
script = '''
# bc post-processes its math library with ed(1), which the base system does not
# ship; this does the same edits with sed.
cat > bc/fix-libmath_h <<'FIX'
sed -i -e '1s/^/{"/' -e 's/$/",/' -e '2,$s/^/"/' libmath.h
sed -i '$d' libmath.h
sed -i '$s/,$/,0}/' libmath.h
FIX
./configure --prefix=/usr --with-readline
make
make DESTDIR="$DESTDIR" install
echo '2^64; scale=20; 4*a(1)' | "$DESTDIR/usr/bin/bc" -l | grep -q '^3\.14159265358979323844'
'''

[ai]
kind = "cli"
launch = "bc"
keywords = ["calculator", "math"]
