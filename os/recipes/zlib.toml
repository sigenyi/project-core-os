[package]
name = "zlib"
version = "1.3.1"
summary = "Compression library (deflate)"
license = "Zlib"
homepage = "https://zlib.net/"

[[source]]
sha256 = "60dd315c07f616887caa029408308a018ace66e3d142726a97db164b3b8f69fb"
urls = ["https://archive.ubuntu.com/ubuntu/pool/main/z/zlib/zlib_1.3.dfsg+really1.3.1.orig.tar.gz"]

[build]
script = '''
./configure --prefix=/usr
make
make DESTDIR="$DESTDIR" install
rm -f "$DESTDIR/usr/lib/libz.a"
'''
