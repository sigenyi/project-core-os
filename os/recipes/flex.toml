[package]
name = "flex"
version = "2.6.4"
summary = "Fast lexical analyser generator"
license = "BSD-3-Clause"
homepage = "https://github.com/westes/flex"

[[source]]
sha256 = "e87aae032bf07c26f85ac0ed3250998c37621d95f8bd748b31f15b33c45ee995"
urls = ["https://archive.ubuntu.com/ubuntu/pool/main/f/flex/flex_2.6.4.orig.tar.gz"]

[build]
script = '''
./configure --prefix=/usr --docdir=/usr/share/doc/flex-2.6.4 --disable-static
make
make DESTDIR="$DESTDIR" install
ln -sf flex "$DESTDIR/usr/bin/lex"
ln -sf flex.1 "$DESTDIR/usr/share/man/man1/lex.1"
'''
