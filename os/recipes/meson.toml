[package]
name = "meson"
version = "1.10.1"
summary = "Meson build system"
license = "Apache-2.0"
homepage = "https://mesonbuild.com/"

[[source]]
sha256 = "c42296f12db316a4515b9375a5df330f2e751ccdd4f608430d41d7d6210e4317"
urls = ["https://github.com/mesonbuild/meson/releases/download/1.10.1/meson-1.10.1.tar.gz",
        "https://archive.ubuntu.com/ubuntu/pool/universe/m/meson/meson_1.10.1.orig.tar.gz"]
file = "meson_1.10.1.orig.tar.gz"

[build]
script = '''
cd .
pip3 wheel -w dist --no-cache-dir --no-build-isolation --no-deps "$PWD"
# --ignore-installed: otherwise pip skips a wheel whose version the build machine
# already has, and the package comes out empty.
pip3 install --no-index --no-deps --ignore-installed --find-links dist --root="$DESTDIR" \
  --no-warn-script-location --no-compile dist/*.whl
ls "$DESTDIR"/usr/lib/python3.14/site-packages/*.dist-info/RECORD
'''

[runtime]
depends = ["python", "ninja"]
