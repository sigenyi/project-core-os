[package]
name = "binutils"
version = "2.46"
summary = "Assembler, linker and binary tools"
license = "GPL-3.0-or-later"
homepage = "https://www.gnu.org/software/binutils/"

[[source]]
sha256 = "a389850c2d3919f2cc96fb8b5e7711eacfc819259aaffb11615c9fb9756eaeae"
urls = ["https://ftp.gnu.org/gnu/binutils/binutils-with-gold-2.46.tar.xz",
        "https://archive.ubuntu.com/ubuntu/pool/main/b/binutils/binutils_2.46.orig.tar.xz"]
file = "binutils_2.46.orig.tar.xz"

[build]
files = ["lib/compare-results.py", "binutils/expected-failures.txt"]
script = '''
mkdir build && cd build
../configure --prefix=/usr --sysconfdir=/etc --build="$CORE_TGT" --enable-ld=default \
  --enable-plugins --enable-shared --disable-werror --enable-64-bit-bfd \
  --enable-new-dtags --with-system-zlib --enable-default-hash-style=gnu --enable-gprofng=no
make tooldir=/usr
make tooldir=/usr DESTDIR="$DESTDIR" install
rm -f "$DESTDIR"/usr/lib/lib{bfd,ctf,ctf-nobfd,opcodes,sframe}.a
'''
check = '''
cd build
make -k check > "$RESULTS/make-check.log" 2>&1 || true
# Each suite writes <tool>.sum in its own directory.
sums=$(find . -name '*.sum' | sort)
for f in $sums; do cp --parents "$f" "$RESULTS/"; [ -f "${f%.sum}.log" ] && cp --parents "${f%.sum}.log" "$RESULTS/"; done
# Every suite must have run to its end, each with a floor of its own, a little
# under its full run (binutils 346, gas 2091, ld 3258, libctf 38, libsframe 168
# passes), so that one small suite running nothing cannot hide in the total.
python3 ../compare-results.py --expected ../expected-failures.txt --summary "$RESULTS/summary.txt" \
  --min-pass 5800 --require binutils=330 --require gas=2000 --require ld=3150 \
  --require libctf=35 --require libsframe=160 $sums
'''
