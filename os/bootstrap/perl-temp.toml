[package]
name = "perl-temp"
version = "5.40.1"
summary = "Perl (temporary)"

[[source]]
sha256 = "dfa20c2eef2b4af133525610bbb65dd13777ecf998c9c5b1ccf0d308e732ee3f"
urls = ["https://www.cpan.org/src/5.0/perl-5.40.1.tar.xz",
        "https://archive.ubuntu.com/ubuntu/pool/main/p/perl/perl_5.40.1.orig.tar.xz"]
file = "perl_5.40.1.orig.tar.xz"

[build]
stage = "temp"
script = '''
sh Configure -des -D prefix=/usr -D vendorprefix=/usr -D useshrplib \
  -D privlib=/usr/lib/perl5/5.40/core_perl -D archlib=/usr/lib/perl5/5.40/core_perl \
  -D sitelib=/usr/lib/perl5/5.40/site_perl -D sitearch=/usr/lib/perl5/5.40/site_perl \
  -D vendorlib=/usr/lib/perl5/5.40/vendor_perl -D vendorarch=/usr/lib/perl5/5.40/vendor_perl
make
make install
'''
