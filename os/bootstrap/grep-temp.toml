[package]
name = "grep-temp"
version = "3.12"
summary = "GNU grep (temporary)"

[[source]]
sha256 = "2649b27c0e90e632eadcd757be06c6e9a4f48d941de51e7c0f83ff76408a07b9"
urls = ["https://ftp.gnu.org/gnu/grep/grep-3.12.tar.xz",
        "https://archive.ubuntu.com/ubuntu/pool/main/g/grep/grep_3.12.orig.tar.xz"]
file = "grep_3.12.orig.tar.xz"

[build]
stage = "cross"
script = '''
./configure --prefix=/usr --host="$LFS_TGT" --build="$(build-aux/config.guess)" 
make
make DESTDIR="$LFS" install
'''
