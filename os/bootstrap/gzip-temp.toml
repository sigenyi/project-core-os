[package]
name = "gzip-temp"
version = "1.14"
summary = "GNU gzip (temporary)"

[[source]]
sha256 = "01a7b881bd220bfdf615f97b8718f80bdfd3f6add385b993dcf6efd14e8c0ac6"
urls = ["https://ftp.gnu.org/gnu/gzip/gzip-1.14.tar.xz",
        "https://archive.ubuntu.com/ubuntu/pool/main/g/gzip/gzip_1.14.orig.tar.xz"]
file = "gzip_1.14.orig.tar.xz"

[build]
stage = "cross"
script = '''
./configure --prefix=/usr --host="$LFS_TGT" --build="$(build-aux/config.guess)" 
make
make DESTDIR="$LFS" install
'''
