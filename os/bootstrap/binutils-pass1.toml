[package]
name = "binutils-pass1"
version = "2.46"
summary = "Cross binutils"

[[source]]
sha256 = "a389850c2d3919f2cc96fb8b5e7711eacfc819259aaffb11615c9fb9756eaeae"
urls = ["https://ftp.gnu.org/gnu/binutils/binutils-with-gold-2.46.tar.xz",
        "https://archive.ubuntu.com/ubuntu/pool/main/b/binutils/binutils_2.46.orig.tar.xz"]
file = "binutils_2.46.orig.tar.xz"

[build]
stage = "cross"
script = '''
mkdir build && cd build
../configure --prefix="$LFS/tools" --with-sysroot="$LFS" --target="$LFS_TGT" \
  --disable-nls --enable-gprofng=no --disable-werror \
  --enable-new-dtags --enable-default-hash-style=gnu
make
make install
'''
