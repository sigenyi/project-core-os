[package]
name = "util-linux-temp"
version = "2.41.3"
summary = "util-linux (temporary)"

[[source]]
sha256 = "3330d873f0fceb5560b89a7dc14e4f3288bbd880e96903ed9b50ec2b5799e58b"
urls = ["https://www.kernel.org/pub/linux/utils/util-linux/v2.41/util-linux-2.41.3.tar.xz",
        "https://archive.ubuntu.com/ubuntu/pool/main/u/util-linux/util-linux_2.41.3.orig.tar.xz"]
file = "util-linux_2.41.3.orig.tar.xz"

[build]
stage = "temp"
script = '''
mkdir -p /var/lib/hwclock
./configure --libdir=/usr/lib --runstatedir=/run --disable-chfn-chsh --disable-login \
  --disable-nologin --disable-su --disable-setpriv --disable-runuser --disable-pylibmount \
  --disable-static --disable-liblastlog2 --without-python \
  ADJTIME_PATH=/var/lib/hwclock/adjtime --docdir=/usr/share/doc/util-linux-2.41.3
make
make install
'''
