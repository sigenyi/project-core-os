[package]
name = "libstdcxx-cross"
version = "15.2.0"
summary = "GNU C++ library (cross-compiled)"

[[source]]
sha256 = "3063dafdeed9fb9565f099b2560379bce08dae2b461ed4e30dd8d999f5f5747c"
urls = ["https://archive.ubuntu.com/ubuntu/pool/main/g/gcc-15/gcc-15_15.2.0.orig.tar.gz"]
inner = "gcc-15-15.2.0/gcc-15.2.0.tar.xz"

[build]
stage = "cross"
script = '''
mkdir build && cd build
../libstdc++-v3/configure --host="$LFS_TGT" --build="$(../config.guess)" --prefix=/usr \
  --disable-multilib --disable-nls --disable-libstdcxx-pch \
  --with-gxx-include-dir="/tools/$LFS_TGT/include/c++/15.2.0"
make
make DESTDIR="$LFS" install
rm -f "$LFS"/usr/lib/lib{stdc++{,exp,fs},supc++}.la
'''
