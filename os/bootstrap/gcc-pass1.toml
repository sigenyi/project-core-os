[package]
name = "gcc-pass1"
version = "15.2.0"
summary = "Cross GCC without libc"

[[source]]
sha256 = "3063dafdeed9fb9565f099b2560379bce08dae2b461ed4e30dd8d999f5f5747c"
urls = ["https://archive.ubuntu.com/ubuntu/pool/main/g/gcc-15/gcc-15_15.2.0.orig.tar.gz"]
inner = "gcc-15-15.2.0/gcc-15.2.0.tar.xz"

[[source]]
sha256 = "b67ba0383ef7e8a8563734e2e889ef5ec3c3b898a01d00fa0a6869ad81c6ce01"
urls = ["https://ftp.gnu.org/gnu/mpfr/mpfr-4.2.2.tar.xz",
        "https://archive.ubuntu.com/ubuntu/pool/main/m/mpfr4/mpfr4_4.2.2.orig.tar.xz"]
file = "mpfr4_4.2.2.orig.tar.xz"
dest = "mpfr"

[[source]]
sha256 = "bd2966e6d277f79328e894a5a9f3ba3fbf2ed2be81def5f48623e30c23fb1572"
urls = ["https://archive.ubuntu.com/ubuntu/pool/main/g/gmp/gmp_6.3.0+dfsg.orig.tar.xz"]
dest = "gmp"

[[source]]
sha256 = "ab642492f5cf882b74aa0cb730cd410a81edcdbec895183ce930e706c1c759b8"
urls = ["https://ftp.gnu.org/gnu/mpc/mpc-1.3.1.tar.gz",
        "https://archive.ubuntu.com/ubuntu/pool/main/m/mpclib3/mpclib3_1.3.1.orig.tar.gz"]
file = "mpclib3_1.3.1.orig.tar.gz"
dest = "mpc"

[build]
stage = "cross"
script = '''
sed -i "s| doc/Makefile||" gmp/configure
sed -i "s/ tune doc$/ tune/" gmp/Makefile.in
sed -e '/m64=/s/lib64/lib/' -i.orig gcc/config/i386/t-linux64
mkdir build && cd build
../configure --target="$LFS_TGT" --prefix="$LFS/tools" --with-glibc-version=2.43 \
  --with-sysroot="$LFS" --with-newlib --without-headers \
  --enable-default-pie --enable-default-ssp --disable-nls --disable-shared \
  --disable-multilib --disable-threads --disable-libatomic --disable-libgomp \
  --disable-libquadmath --disable-libssp --disable-libvtv --disable-libstdcxx \
  --enable-languages=c,c++
make
make install
cd ..
cat gcc/limitx.h gcc/glimits.h gcc/limity.h > \
  "$(dirname "$("$LFS_TGT-gcc" -print-libgcc-file-name)")/include/limits.h"
'''
