[package]
name = "coreutils-temp"
version = "9.7"
summary = "GNU coreutils (temporary)"

[[source]]
sha256 = "e8bb26ad0293f9b5a1fc43fb42ba970e312c66ce92c1b0b16713d7500db251bf"
urls = ["https://ftp.gnu.org/gnu/coreutils/coreutils-9.7.tar.xz",
        "https://archive.ubuntu.com/ubuntu/pool/main/c/coreutils/coreutils_9.7.orig.tar.xz"]
file = "coreutils_9.7.orig.tar.xz"

[build]
stage = "cross"
script = '''
./configure --prefix=/usr --host="$LFS_TGT" --build="$(build-aux/config.guess)" --enable-install-program=hostname --enable-no-install-program=kill,uptime
make
make DESTDIR="$LFS" install
'''
