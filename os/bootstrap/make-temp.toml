[package]
name = "make-temp"
version = "4.4.1"
summary = "GNU make (temporary)"

[[source]]
sha256 = "3b16b00ea1079af9f8096bbc71ff7cc00c249fc6a862003da3c42308a0adb0fe"
urls = ["https://archive.ubuntu.com/ubuntu/pool/main/m/make-dfsg/make-dfsg_4.4.1.orig.tar.xz"]

[build]
stage = "cross"
script = '''
# The +dfsg tarball has no doc/ directory.
sed -i 's| doc/Makefile||' configure
sed -i 's/^SUBDIRS = lib po doc$/SUBDIRS = lib po/; /^man_MANS = /d' Makefile.in
./configure --prefix=/usr --host="$LFS_TGT" --build="$(build-aux/config.guess)" --without-guile
make
make DESTDIR="$LFS" install
'''
