[package]
name = "binutils-pass2"
version = "2.46"
summary = "binutils (temporary, cross-compiled)"

[[source]]
sha256 = "a389850c2d3919f2cc96fb8b5e7711eacfc819259aaffb11615c9fb9756eaeae"
urls = ["https://ftp.gnu.org/gnu/binutils/binutils-with-gold-2.46.tar.xz",
        "https://archive.ubuntu.com/ubuntu/pool/main/b/binutils/binutils_2.46.orig.tar.xz"]
file = "binutils_2.46.orig.tar.xz"

[build]
stage = "cross"
script = '''
# Keep libtool from linking libctf against the host's libraries.
sed '6031s/$add_dir//' -i ltmain.sh
mkdir build && cd build
../configure --prefix=/usr --build="$(../config.guess)" --host="$LFS_TGT" \
  --disable-nls --enable-shared --enable-gprofng=no --disable-werror \
  --enable-64-bit-bfd --enable-new-dtags --enable-default-hash-style=gnu
make
make DESTDIR="$LFS" install
rm -f "$LFS"/usr/lib/lib{bfd,ctf,ctf-nobfd,opcodes,sframe}.{a,la}
'''
