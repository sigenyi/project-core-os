id = "svc-timesyncd-disabled"
family = "services"
kind = "repair"
request = "Keep the clock synchronised automatically, now and after reboots."
baseline = "model"

[fixture]
commands = ["systemctl disable --now systemd-timesyncd"]

[[solution]]
action = "enable_service"
args = { service = "systemd-timesyncd", now = true }

[[check]]
name = "systemd-timesyncd is enabled"
command = "systemctl is-enabled --quiet systemd-timesyncd"

[[check]]
name = "systemd-timesyncd is running"
command = "systemctl is-active --quiet systemd-timesyncd"
